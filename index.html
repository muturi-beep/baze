<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Baze</title>
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app"></div>
    <div id="toast-root"></div>
    <script type="module" src="js/main.js"></script>

    <script>
      let deferredPrompt;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });

      window.installPWA = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === "accepted") {
            console.log("User accepted the install prompt");
          }
          deferredPrompt = null;
        } else {
          // Fallback for iOS or if the prompt didn't trigger
          const isIOS =
            /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          if (isIOS) {
            alert(
              "To install on iPhone:\n\n1. Tap the Share button (square with an arrow).\n2. Scroll down and tap 'Add to Home Screen'.",
            );
          } else {
            alert(
              "To install:\n\n1. Tap the 3 dots in the top right corner of your browser.\n2. Tap 'Install App' or 'Add to Home Screen'.",
            );
          }
        }
      };
    </script>
  </body>
</html>
