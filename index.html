<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Baze</title>
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      let deferredPrompt;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log("✅ Chrome is ready to install the app!");
      });

      window.installPWA = async () => {
        // Check if the app is already running as an installed app
        const isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone;

        if (isStandalone) {
          alert("You are already using the installed Baze App!");
          return;
        }

        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === "accepted") {
            deferredPrompt = null;
          }
        } else {
          // If Chrome hasn't given us the prompt yet, tell the user to use the menu
          const isIOS =
            /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          if (isIOS) {
            alert(
              "To install on iPhone:\n\n1. Tap the Share button (square with an arrow).\n2. Scroll down and tap 'Add to Home Screen'.",
            );
          } else {
            alert(
              "Chrome is holding the install prompt.\n\n1. Scroll up and down on the Home page for 30 seconds.\n2. Tap the 3-dot menu and select 'Add to Home Screen'.\n3. Or uninstall the app if you already installed it.",
            );
          }
        }
      };
    </script>
  </head>
  <body>
    <div class="app-shell" id="app"></div>
    <div id="toast-root"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
